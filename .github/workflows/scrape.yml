name: Daily scrape

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new entries this run (total across all sources)"
        type: string
        default: "500"
      source:
        description: "Source filter (blank = all)"
        type: choice
        options:
          - ""
          - github-awesome
          - github-topic
          - huggingface
          - n8n
          - pipedream
          - make
        default: ""
      dry_run:
        description: "Dry run (no DB writes)"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run scraper
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '500' }}"
          SOURCE="${{ github.event.inputs.source }}"
          if [ -n "$SOURCE" ]; then
            ARGS="$ARGS --source $SOURCE"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run scrape -- $ARGS
